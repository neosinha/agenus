<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NAS Frontend</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .hidden { display: none; }
    #tabs button { margin-right: 10px; }
    #files { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>NAS Frontend</h1>
  <div id="auth">
    <h2>Login</h2>
    <input id="login-user" placeholder="username" />
    <input id="login-pass" type="password" placeholder="password" />
    <button onclick="login()">Login</button>
    <p>or register:</p>
    <input id="reg-user" placeholder="username" />
    <input id="reg-pass" type="password" placeholder="password" />
    <button onclick="register()">Register</button>
  </div>

  <div id="app" class="hidden">
    <button onclick="showSettings()">Settings</button>
    <div id="tabs">
      <button onclick="loadFiles('photos')">Photos</button>
      <button onclick="loadFiles('pdfs')">PDFs</button>
      <button onclick="loadFiles('movies')">Movies</button>
    </div>
    <ul id="files"></ul>
  </div>

  <div id="settings" class="hidden">
    <h3>Cloud Credentials</h3>
    <input id="google" placeholder="Google token" />
    <input id="icloud" placeholder="iCloud token" />
    <button onclick="saveCreds()">Save</button>
    <button onclick="hideSettings()">Close</button>
  </div>

<script>
let currentUser = null;

async function register() {
  const username = document.getElementById('reg-user').value;
  const password = document.getElementById('reg-pass').value;
  const res = await fetch('/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username, password})
  });
  const data = await res.json();
  alert(data.status || data.error);
}

async function login() {
  const username = document.getElementById('login-user').value;
  const password = document.getElementById('login-pass').value;
  const res = await fetch('/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username, password})
  });
  const data = await res.json();
  if (data.status === 'ok') {
    currentUser = username;
    document.getElementById('auth').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
  } else {
    alert(data.error);
  }
}

function showSettings() {
  document.getElementById('settings').classList.remove('hidden');
}
function hideSettings() {
  document.getElementById('settings').classList.add('hidden');
}

async function saveCreds() {
  const google = document.getElementById('google').value;
  const icloud = document.getElementById('icloud').value;
  const res = await fetch('/credentials', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: currentUser, google, icloud})
  });
  const data = await res.json();
  alert(data.status || data.error);
  hideSettings();
}

async function loadFiles(type) {
  const res = await fetch(`/files/${type}`);
  const data = await res.json();
  const list = document.getElementById('files');
  list.innerHTML = '';
  (data.files || []).forEach(f => {
    const li = document.createElement('li');
    li.textContent = f;
    list.appendChild(li);
  });
}
</script>
</body>
</html>
